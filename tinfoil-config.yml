cvm-version: 0.14.13
cpus: 32
memory: 786432
gpus: 4

models:
  - name: "glm-5-3"
    repo: "Inferact/GLM-5.3-NVFP4@ce67b36f3669192b5bb233819f0fda6c8a9837f8"
    mpk: "50f49b63a8139cf970d93e81978c7c21ab42e96b84e80c123f496ae33cb768a8_464867299328_3e063cc8-dc79-5cc0-9fc0-f4201b036669"
    schema: 2

containers:
  - name: "glm-5-3"
    image: "ghcr.io/tinfoilsh/confidential-glm5-3-nvfp4@sha256:0889729c42969ecb7dcbbce23fb48f5dd62a26b19af1f29a4ac0437c9ee6a215" # v0.0.5
    runtime: nvidia
    gpus: all
    restart: always
    shm_size: 384g
    env:
      - RUNAI_STREAMER_MEMORY_LIMIT: "2147483648"
      - RUNAI_STREAMER_CONCURRENCY: "8"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ALLREDUCE_USE_FLASHINFER: "0"
      - VLLM_USE_V2_MODEL_RUNNER: "1"
      - VLLM_DISABLE_UVA: "1"
      - VLLM_KV_CACHE_LAYOUT: "BLHNC"
      - VLLM_USE_SIMPLE_KV_OFFLOAD: "0"
      - VLLM_FLASHINFER_ALLREDUCE_BACKEND: "trtllm"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-50f49b63a8139cf970d93e81978c7c21ab42e96b84e80c123f496ae33cb768a8",
        "--kv-cache-dtype",
        "fp8_e4m3",
        "--enable-prefix-caching",
        "--kv-cache-metrics",
        "--kv-cache-metrics-sample",
        "0.01",
        "--block-size",
        "64",
        "--kv-offloading-size",
        "256",
        "--kv-offloading-backend",
        "native",
        "--kv-transfer-config",
        '{"kv_connector_extra_config":{"blocks_per_chunk":1,"store_threshold":0,"eviction_policy":"lru","offload_prompt_only":true}}',
        "--tensor-parallel-size",
        "4",
        "--enable-expert-parallel",
        "--attention-backend",
        "FLASHINFER_MLA_SPARSE",
        "--tool-call-parser",
        "glm47",
        "--enable-auto-tool-choice",
        "--enable-prompt-tokens-details",
        "--enable-force-include-usage",
        "--reasoning-parser",
        "glm45",
        "--served-model-name",
        "glm-5-3",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--load-format",
        "runai_streamer",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "1048576",
        "--max-num-seqs",
        "32",
        "--max-num-batched-tokens",
        "16384",
        "--async-scheduling",
        "--hf-overrides",
        '{"moe_router_batch_invariant":true}',
        "--speculative-config",
        '{"method":"mtp","num_speculative_tokens":5}',
        "--no-enable-flashinfer-autotune",
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
